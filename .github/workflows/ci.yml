name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check, Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format Check
        run: cargo fmt --check

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test
